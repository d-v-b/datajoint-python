[build-system]
requires = ["setuptools>=60"]
build-backend = "setuptools.build_meta"

[project]
name = "datajoint"
# dynamically set in tools.setuptools.dynamic
dynamic = ["version"]
dependencies = [
  "numpy",
  "pymysql>=0.7.2",
  "deepdiff",
  "pyparsing",
  "ipython",
  "pandas",
  "tqdm",
  "networkx",
  "pydot",
  "moto[s3]",
  "matplotlib",
  "faker",
  "urllib3",
  "setuptools",
]
requires-python = ">=3.9,<4.0"
authors = [
  {name = "Dimitri Yatsenko", email = "dimitri@datajoint.com"},
  {name = "Thinh Nguyen", email = "thinh@datajoint.com"},
  {name = "Raphael Guzman"},
  {name = "Edgar Walker"},
  {name = "DataJoint Contributors", email = "support@datajoint.com"},
]
maintainers = [
  {name = "Dimitri Yatsenko", email = "dimitri@datajoint.com"},
  {name = "DataJoint Contributors", email = "support@datajoint.com"},
]
# manually sync here: https://docs.datajoint.com/core/datajoint-python/latest/#welcome-to-datajoint-for-python
description = "DataJoint for Python is a framework for scientific workflow management based on relational principles. DataJoint is built on the foundation of the relational data model and prescribes a consistent method for organizing, populating, computing, and querying data."
readme = "README.md"
license = {file = "LICENSE.txt"}
keywords = [
    "database",
    "automated",
    "automation",
    "compute",
    "data",
    "pipeline",
    "workflow",
    "scientific",
    "science",
    "research",
    "neuroscience",
    "bioinformatics",
    "bio-informatics",
    "datajoint",
]
# https://pypi.org/classifiers/
classifiers = [
  "Programming Language :: Python",
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://docs.datajoint.com/"
Documentation = "https://docs.datajoint.com/"
Repository = "https://github.com/datajoint/datajoint-python"
"Bug Tracker" = "https://github.com/datajoint/datajoint-python/issues"
"Release Notes" = "https://github.com/datajoint/datajoint-python/releases"

[project.entry-points."console_scripts"]
dj = "datajoint.cli:cli"
datajoint = "datajoint.cli:cli"

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
]
dev = [
  "pre-commit",
  "black==24.2.0",
  "flake8",
  "isort",
  "codespell",
  # including test
  "pytest",
  "pytest-cov",
]

[tool.isort]
profile = "black"

[tool.setuptools]
packages = ["datajoint"]

[tool.setuptools.dynamic]
version = { attr = "datajoint.version.__version__"}

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-aarch64", "linux-64"]

[tool.pixi.pypi-dependencies]
datajoint = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
echo-env = "echo $PIXI_PROJECT_ROOT"
# Initialize and start MySQL
init-db = "$PIXI_PROJECT_ROOT/mysql-wrapper.sh init"

start-db = "$PIXI_PROJECT_ROOT/mysql-wrapper.sh start"

# Start mock S3 server (using moto)
start-s3 = """
bash -c '
  # moto server will be started by pytest fixtures
  echo "S3 mock will be started by pytest fixtures"
'
"""

# Run pytest against the running services
test = """
bash -c '
  # Clear any existing Docker-related environment variables
  unset DJ_HOST DJ_USER DJ_PASS DJ_TEST_HOST DJ_TEST_USER DJ_TEST_PASSWORD
  
  # Set environment variables for Docker MySQL (temporary)
  export DJ_HOST=db
  export DJ_USER=root
  export DJ_PASS=password
  export DJ_TEST_HOST=db
  export DJ_TEST_USER=datajoint
  export DJ_TEST_PASSWORD=datajoint
  export MYSQL_PORT=3306
  export DJ_TEST_DATABASE=sqlite:///:memory:
  export S3_ENDPOINT=localhost:9000
  export S3_ACCESS_KEY=datajoint
  export S3_SECRET_KEY=datajoint
  export S3_BUCKET=datajoint.test

  pip install -q -e ".[test]"
  pytest --cov-report term-missing --cov=datajoint tests
'
"""

# Stop services
stop-db = "$PIXI_PROJECT_ROOT/mysql-wrapper.sh stop"
stop-s3 = "bash -c 'echo S3 mock stopped automatically'"

# CI-style task: initialize and start services, run tests, then stop
ci-test = """
bash -c '
  echo "Initializing and starting services..."
  pixi run init-db
  pixi run start-db
  pixi run start-s3
  
  echo "Running tests..."
  pixi run test
  
  echo "Stopping services..."
  pixi run stop-db
  pixi run stop-s3
'
"""

[tool.pixi.dependencies]
mysql = "8.0.*"
